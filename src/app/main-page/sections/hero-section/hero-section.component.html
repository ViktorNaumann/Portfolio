<section id="hero" class="hero-section">
  <div class="main-content">
    <div class="title-container">
      <button class="hello-button">
        <span class="default-text">{{ 'HERO.HELLO_WORLD' | translate }}</span>
        <span class="hover-text">{{ 'HERO.IM_VIKTOR' | translate }}</span>
        <img src="assets/img/hero/waving_hand.png" alt="Waving Hand" class="waving-hand">
      </button>
      
      <h1 class="title-first">
        <span class="letter">F</span><span class="letter">r</span><span class="letter">o</span><span class="letter">n</span><span class="letter">t</span><span class="letter">e</span><span class="letter">n</span><span class="letter">d</span>
      </h1>
      <h1 class="title-second">
        <span class="letter">d</span><span class="letter">e</span><span class="letter">v</span><span class="letter">e</span><span class="letter">l</span><span class="letter">o</span><span class="letter">p</span><span class="letter">e</span><span class="letter">r</span>
      </h1>
      
      <button class="cta-button" [routerLink]="['/']" fragment="contact">{{ 'HERO.GET_IN_TOUCH' | translate }}</button>
    </div>
    
    <div class="polaroid-container">
      <img src="assets/img/hero/Viktor.webp" alt="Viktor Polaroid" class="polaroid">
      <div class="polaroid-text">
        <span class="default-text">Viktor :)</span>
        <span class="hover-text">Viktor :D</span>
      </div>
    </div>
  </div>
  
  <div class="social-icons">
    <a href="https://www.linkedin.com/in/viktor-naumann" target="_blank" class="icon linkedin">
      <img src="assets/img/hero/contact-icons/Component 3.webp" alt="LinkedIn">
    </a>
    <a href="https://github.com/ViktorNaumann" target="_blank" class="icon github">
      <img src="assets/img/hero/contact-icons/Property 1=Git hub.webp" alt="GitHub">
    </a>
    <a href="mailto:Viktor_Naumann@hotmail.de" class="icon email">
      <img src="assets/img/hero/contact-icons/Component 3 (1).webp" alt="Email">
    </a>
  </div>
</section>
